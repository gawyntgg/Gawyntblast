<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAWYNT BLAST | DEFINITIVE EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');

        :root {
            --bg: #080810;
            --panel: #12121e;
            --cell: #1d1d2b;
            --accent: #00f0ff;
            --hue: 0deg;
            --shake: 0px;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; background-color: var(--bg);
            color: #fff; font-family: 'Outfit', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; overflow: hidden;
        }

        /* UI Styling */
        .game-wrapper {
            display: flex; flex-direction: column; align-items: center;
            transform: translate(var(--shake), var(--shake));
        }

        .header { text-align: center; margin-bottom: 20px; filter: hue-rotate(var(--hue)); }
        h1 { 
            font-size: 3rem; margin: 0; font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .stats { display: flex; gap: 30px; margin-top: 10px; }
        .stat-v { font-size: 1.8rem; font-weight: 900; color: var(--accent); }
        .stat-l { font-size: 0.7rem; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; }

        /* Board Styling */
        #grid-container {
            background: var(--panel); padding: 10px; border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: grid; grid-template-columns: repeat(8, 46px);
            grid-template-rows: repeat(8, 46px); gap: 5px;
            position: relative;
        }

        .cell {
            width: 46px; height: 46px; background: var(--cell);
            border-radius: 6px; transition: background 0.1s;
        }

        .cell.filled {
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.1);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cell.ghost { opacity: 0.35 !important; filter: brightness(1.5); }

        @keyframes popIn { 0% { transform: scale(0.7); } 100% { transform: scale(1); } }

        /* Dock / Pieces */
        #dock {
            margin-top: 40px; display: flex; justify-content: space-around;
            width: 100%; max-width: 400px; height: 130px; align-items: center;
        }

        .dock-slot {
            width: 110px; height: 110px; display: flex; align-items: center;
            justify-content: center; background: rgba(255,255,255,0.03); border-radius: 15px;
        }

        .shape { display: grid; cursor: grab; filter: hue-rotate(var(--hue)); }
        .s-cell { width: 22px; height: 22px; border-radius: 4px; margin: 1px; }

        /* Drag Visuals */
        #drag-proxy {
            position: fixed; pointer-events: none; display: none; z-index: 1000;
            filter: hue-rotate(var(--hue)); transform: scale(1.6);
            transform-origin: center center;
        }

        /* Combo Popup */
        #combo-alert {
            position: absolute; width: 100%; text-align: center; top: 35%;
            font-size: 3.5rem; font-weight: 900; color: #ffcc00;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5); pointer-events: none;
            display: none; z-index: 500;
        }

        /* Colors */
        .c-blue { background: linear-gradient(135deg, #00d2ff, #3a7bd5); }
        .c-red { background: linear-gradient(135deg, #f85032, #e73827); }
        .c-green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .c-purple { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
        .c-orange { background: linear-gradient(135deg, #f2994a, #f2c94c); }

        /* Menus */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .btn {
            margin-top: 25px; padding: 15px 45px; font-size: 1.2rem;
            font-weight: 900; background: var(--accent); color: #000;
            border: none; border-radius: 50px; cursor: pointer;
        }

        @media (max-width: 450px) {
            #grid-container { grid-template-columns: repeat(8, 38px); grid-template-rows: repeat(8, 38px); }
            .cell { width: 38px; height: 38px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <h1>GAWYNT BLAST</h1>
            <div class="stats">
                <div class="stat-box"><span class="stat-l">Score</span><div id="ui-score" class="stat-v">0</div></div>
                <div class="stat-box"><span class="stat-l">Best</span><div id="ui-best" class="stat-v">0</div></div>
            </div>
        </div>

        <div id="grid-container">
            <div id="combo-alert">COMBO!</div>
        </div>

        <div id="dock">
            <div class="dock-slot" data-slot="0"></div>
            <div class="dock-slot" data-slot="1"></div>
            <div class="dock-slot" data-slot="2"></div>
        </div>
    </div>

    <div id="drag-proxy"></div>

    <div id="game-over" class="overlay">
        <h2 style="font-size: 3.5rem; color: #ff3366; margin:0;">GAME OVER</h2>
        <p id="final-score" style="font-size: 1.5rem; opacity: 0.8;"></p>
        <button class="btn" onclick="Game.restart()">RETRY</button>
    </div>

    <script>
        /**
         * AUDIO SYSTEM - Synthesized for zero lag
         */
        const Sfx = {
            ctx: null,
            init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(freq, type, dur, vol) {
                this.init();
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + dur);
                g.gain.setValueAtTime(vol, this.ctx.currentTime);
                g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + dur);
                osc.connect(g); g.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + dur);
            },
            grab() { this.play(600, 'sine', 0.1, 0.1); },
            snap() { this.play(200, 'triangle', 0.15, 0.2); },
            blast() { this.play(100, 'square', 0.3, 0.1); }
        };

        /**
         * GAME ENGINE
         */
        const Game = {
            board: Array.from({length: 8}, () => Array(8).fill(null)),
            score: 0, combo: 0, best: localStorage.getItem('gb_best') || 0,
            hue: 0, activeDrag: null, dockState: [null, null, null],

            SHAPES: [
                { s: [[1,1],[1,1]], c: 'c-blue' },     { s: [[1,1,1,1]], c: 'c-red' },
                { s: [[1],[1],[1],[1]], c: 'c-red' }, { s: [[1,1,1],[0,1,0]], c: 'c-purple' },
                { s: [[1,1,1],[1,0,0]], c: 'c-orange' }, { s: [[1,1,1]], c: 'c-green' },
                { s: [[1,1]], c: 'c-blue' },           { s: [[1]], c: 'c-orange' },
                { s: [[1,1,0],[0,1,1]], c: 'c-red' },  { s: [[0,1,1],[1,1,0]], c: 'c-green' }
            ],

            init() {
                const container = document.getElementById('grid-container');
                for(let r=0; r<8; r++) {
                    for(let c=0; c<8; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell'; cell.id = `cell-${r}-${c}`;
                        container.appendChild(cell);
                    }
                }
                this.updateUI();
                this.refreshDock();
                
                // Add Global Listeners
                window.addEventListener('pointermove', (e) => this.onMove(e));
                window.addEventListener('pointerup', (e) => this.onEnd(e));
            },

            refreshDock() {
                this.hue += 40;
                document.documentElement.style.setProperty('--hue', this.hue + 'deg');
                const slots = document.querySelectorAll('.dock-slot');
                slots.forEach((slot, i) => {
                    const data = this.SHAPES[Math.floor(Math.random() * this.SHAPES.length)];
                    this.dockState[i] = data;
                    slot.innerHTML = '';
                    const shapeEl = this.createShapeEl(data, i);
                    slot.appendChild(shapeEl);
                });
                setTimeout(() => this.checkGameOver(), 400);
            },

            createShapeEl(data, index) {
                const el = document.createElement('div');
                el.className = 'shape';
                el.style.gridTemplateColumns = `repeat(${data.s[0].length}, 1fr)`;
                data.s.forEach(row => row.forEach(v => {
                    const c = document.createElement('div');
                    c.className = v ? `s-cell ${data.c}` : 's-cell';
                    c.style.opacity = v ? '1' : '0';
                    el.appendChild(c);
                }));
                el.addEventListener('pointerdown', (e) => this.onGrab(e, data, index, el));
                return el;
            },

            onGrab(e, data, index, el) {
                Sfx.grab();
                this.activeDrag = { data, index, el };
                const proxy = document.getElementById('drag-proxy');
                proxy.innerHTML = el.innerHTML;
                proxy.style.display = 'grid';
                proxy.style.gridTemplateColumns = el.style.gridTemplateColumns;
                proxy.style.width = el.offsetWidth + 'px';
                el.style.visibility = 'hidden';
                this.onMove(e);
            },

            onMove(e) {
                if(!this.activeDrag) return;
                const proxy = document.getElementById('drag-proxy');
                
                // Vertical Offset (Floating above finger)
                const offsetY = 100; 
                proxy.style.left = `${e.clientX - proxy.offsetWidth / 2}px`;
                proxy.style.top = `${e.clientY - proxy.offsetHeight / 2 - offsetY}px`;

                this.clearGhosts();
                const coord = this.getGridAt(e.clientX, e.clientY - offsetY);
                if(coord && this.canPlace(this.activeDrag.data.s, coord.r, coord.c)) {
                    this.showGhost(this.activeDrag.data.s, coord.r, coord.c, this.activeDrag.data.c);
                }
            },

            onEnd(e) {
                if(!this.activeDrag) return;
                const offsetY = 100;
                const coord = this.getGridAt(e.clientX, e.clientY - offsetY);
                
                const proxy = document.getElementById('drag-proxy');
                proxy.style.display = 'none';

                if(coord && this.canPlace(this.activeDrag.data.s, coord.r, coord.c)) {
                    // PLACEMENT ONLY HAPPENS HERE
                    Sfx.snap();
                    this.commitPlace(this.activeDrag.data, coord.r, coord.c);
                    document.querySelector(`.dock-slot[data-slot="${this.activeDrag.index}"]`).innerHTML = '';
                    this.dockState[this.activeDrag.index] = null;
                    this.checkLines();
                    
                    if(this.dockState.every(s => s === null)) this.refreshDock();
                    else this.checkGameOver();
                } else {
                    // Return to dock
                    this.activeDrag.el.style.visibility = 'visible';
                }

                this.clearGhosts();
                this.activeDrag = null;
            },

            getGridAt(x, y) {
                const el = document.elementFromPoint(x, y);
                if(el && el.id.startsWith('cell-')) {
                    const p = el.id.split('-');
                    return { r: parseInt(p[1]), c: parseInt(p[2]) };
                }
                return null;
            },

            canPlace(shape, r, c) {
                for(let i=0; i<shape.length; i++) {
                    for(let j=0; j<shape[i].length; j++) {
                        if(shape[i][j]) {
                            const tr = r + i, tc = c + j;
                            if(tr >= 8 || tc >= 8 || this.board[tr][tc]) return false;
                        }
                    }
                }
                return true;
            },

            commitPlace(data, r, c) {
                data.s.forEach((row, i) => row.forEach((v, j) => {
                    if(v) {
                        this.board[r+i][c+j] = data.c;
                        const cell = document.getElementById(`cell-${r+i}-${c+j}`);
                        cell.className = `cell filled ${data.c}`;
                        cell.style.filter = `hue-rotate(${this.hue}deg)`;
                    }
                }));
                this.score += 10;
                this.updateUI();
            },

            checkLines() {
                let rToClear = [], cToClear = [];
                for(let r=0; r<8; r++) if(this.board[r].every(v => v)) rToClear.push(r);
                for(let c=0; c<8; c++) {
                    let full = true;
                    for(let r=0; r<8; r++) if(!this.board[r][c]) full = false;
                    if(full) cToClear.push(c);
                }

                if(rToClear.length || cToClear.length) {
                    this.combo++;
                    Sfx.blast();
                    this.shake();
                    if(this.combo > 1) this.popCombo();
                    this.score += (rToClear.length + cToClear.length) * 100 * this.combo;
                    
                    rToClear.forEach(r => { for(let c=0; c<8; c++) this.clearCell(r, c); });
                    cToClear.forEach(c => { for(let r=0; r<8; r++) this.clearCell(r, c); });
                } else {
                    this.combo = 0;
                }
                this.updateUI();
            },

            clearCell(r, c) {
                this.board[r][c] = null;
                const el = document.getElementById(`cell-${r}-${c}`);
                el.style.transform = 'scale(0)';
                setTimeout(() => {
                    el.className = 'cell';
                    el.style.transform = '';
                    el.style.filter = '';
                }, 250);
            },

            checkGameOver() {
                let possible = false;
                this.dockState.forEach(shape => {
                    if(!shape) return;
                    for(let r=0; r<8; r++) {
                        for(let c=0; c<8; c++) {
                            if(this.canPlace(shape.s, r, c)) possible = true;
                        }
                    }
                });
                if(!possible && this.dockState.some(s => s !== null)) {
                    document.getElementById('final-score').innerText = `Final Score: ${this.score}`;
                    document.getElementById('game-over').style.display = 'flex';
                }
            },

            updateUI() {
                document.getElementById('ui-score').innerText = this.score;
                if(this.score > this.best) {
                    this.best = this.score;
                    localStorage.setItem('gb_best', this.best);
                }
                document.getElementById('ui-best').innerText = this.best;
            },

            shake() {
                document.documentElement.style.setProperty('--shake', '7px');
                setTimeout(() => document.documentElement.style.setProperty('--shake', '0px'), 150);
            },

            popCombo() {
                const el = document.getElementById('combo-alert');
                el.innerText = `${this.combo}X COMBO!`;
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 800);
            },

            showGhost(s, r, c, cl) {
                s.forEach((row, i) => row.forEach((v, j) => {
                    if(v) document.getElementById(`cell-${r+i}-${c+j}`).classList.add('filled', cl, 'ghost');
                }));
            },

            clearGhosts() {
                document.querySelectorAll('.cell').forEach(c => c.classList.remove('ghost'));
            },

            restart() {
                this.board = Array.from({length: 8}, () => Array(8).fill(null));
                this.score = 0; this.combo = 0; this.hue = 0;
                document.querySelectorAll('.cell').forEach(c => c.className = 'cell');
                document.getElementById('game-over').style.display = 'none';
                this.refreshDock();
                this.updateUI();
            }
        };

        Game.init();
    </script>
</body>
</html>
