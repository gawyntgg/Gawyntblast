<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAWYNT BLAST | OMEGA EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap');

        :root {
            --bg: #030305;
            --panel: rgba(20, 20, 30, 0.8);
            --cell: #1a1a24;
            --accent: #00f0ff;
            --frenzy: #ffaa00;
            --hue: 0deg;
            --shake: 0px;
            --blur: 0px;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; }

        body {
            margin: 0; padding: 0; background-color: var(--bg);
            color: #fff; font-family: 'Outfit', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Advanced Background FX */
        #canvas-fx {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; filter: blur(var(--blur));
        }

        /* UI Containers */
        .glass-panel {
            background: var(--panel); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); z-index: 10;
        }

        .header { text-align: center; margin-bottom: 20px; filter: hue-rotate(var(--hue)); z-index: 20; }
        
        h1 {
            font-size: 3.5rem; margin: 0; font-weight: 900; letter-spacing: -3px;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.5));
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 15px; }
        .stat-v { font-size: 1.5rem; font-weight: 900; color: var(--accent); display: block; }
        .stat-l { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; }

        /* Board */
        #game-board-wrapper {
            position: relative; padding: 15px; transform: translate(var(--shake), var(--shake));
        }

        #grid {
            display: grid; grid-template-columns: repeat(8, 48px);
            grid-template-rows: repeat(8, 48px); gap: 6px;
        }

        .cell {
            width: 48px; height: 48px; background: var(--cell);
            border-radius: 8px; position: relative; overflow: hidden;
            transition: background 0.2s, transform 0.1s;
        }

        .cell::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
        }

        .filled {
            animation: blockEnter 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2), 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes blockEnter { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* The Dock */
        #dock {
            margin-top: 40px; display: flex; justify-content: space-around;
            width: 100%; max-width: 450px; height: 150px; align-items: center;
        }

        .dock-slot {
            width: 120px; height: 120px; display: flex; align-items: center;
            justify-content: center; border-radius: 20px; background: rgba(255,255,255,0.02);
            transition: background 0.3s;
        }

        .shape { display: grid; cursor: grab; filter: hue-rotate(var(--hue)); transition: transform 0.2s; }
        .shape:active { cursor: grabbing; }

        .s-cell { width: 24px; height: 24px; border-radius: 5px; margin: 1px; }

        /* Floating Overlays */
        #drag-proxy {
            position: fixed; pointer-events: none; display: none; z-index: 1000;
            filter: hue-rotate(var(--hue)); transform: scale(1.6);
        }

        #combo-msg {
            position: absolute; width: 100%; text-align: center; top: 40%;
            font-size: 4rem; font-weight: 900; color: var(--frenzy);
            text-shadow: 0 0 30px rgba(255,170,0,0.6); pointer-events: none;
            display: none; z-index: 100;
        }

        /* Color Themes */
        .c-1 { background: linear-gradient(135deg, #00f0ff, #0072ff); }
        .c-2 { background: linear-gradient(135deg, #ff0055, #ff00aa); }
        .c-3 { background: linear-gradient(135deg, #00ffaa, #00cc88); }
        .c-4 { background: linear-gradient(135deg, #aa00ff, #7700ff); }
        .c-5 { background: linear-gradient(135deg, #ffcc00, #ff8800); }

        .ghost { opacity: 0.3 !important; }

        /* Menu Overlays */
        .full-screen-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .btn {
            padding: 18px 60px; font-size: 1.4rem; font-weight: 900;
            background: var(--accent); color: #000; border: none;
            border-radius: 50px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3);
        }

        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        @media (max-width: 500px) {
            #grid { grid-template-columns: repeat(8, 40px); grid-template-rows: repeat(8, 40px); }
            .cell { width: 40px; height: 40px; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-fx"></canvas>

    <div class="header">
        <h1 id="title">GAWYNT BLAST</h1>
        <div class="stats-grid">
            <div class="stat-box"><span class="stat-l">Score</span><span id="ui-score" class="stat-v">0</span></div>
            <div class="stat-box"><span class="stat-l">Streak</span><span id="ui-combo" class="stat-v">0</span></div>
            <div class="stat-box"><span class="stat-l">Best</span><span id="ui-best" class="stat-v">0</span></div>
        </div>
    </div>

    <div id="game-board-wrapper" class="glass-panel">
        <div id="grid"></div>
        <div id="combo-msg">FRENZY!</div>
    </div>

    <div id="dock">
        <div class="dock-slot" data-id="0"></div>
        <div class="dock-slot" data-id="1"></div>
        <div class="dock-slot" data-id="2"></div>
    </div>

    <div id="drag-proxy"></div>

    <div id="game-over" class="full-screen-menu">
        <h2 style="font-size: 4rem; margin: 0; color: var(--accent);">OUT OF MOVES</h2>
        <p id="final-stats" style="font-size: 1.5rem; opacity: 0.7; margin: 20px 0;"></p>
        <button class="btn" onclick="Game.reset()">RESTART ENGINE</button>
    </div>

    <script>
        /**
         * OMEGA AUDIO SYSTEM
         */
        const AudioSys = {
            ctx: null,
            async init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            
            tone(freq, type, dur, vol, slide = 0) {
                this.init();
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if(slide) osc.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
                
                g.gain.setValueAtTime(vol, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
                
                osc.connect(g); g.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + dur);
            },

            playPick() { this.tone(440, 'sine', 0.1, 0.1, 880); },
            playSnap() { this.tone(200, 'square', 0.1, 0.05, 50); },
            playBlast(deep = false) {
                this.init();
                const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.4, this.ctx.sampleRate);
                const d = b.getChannelData(0);
                for(let i=0; i<d.length; i++) d[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource(); src.buffer = b;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(deep ? 0.3 : 0.15, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                src.connect(g); g.connect(this.ctx.destination);
                src.start();
            },
            playCombo(n) { this.tone(300 + (n * 100), 'triangle', 0.4, 0.2, 600 + (n * 100)); }
        };

        /**
         * PARTICLE ENGINE
         */
        const FX = {
            canvas: document.getElementById('canvas-fx'),
            ctx: null,
            particles: [],
            init() {
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.loop();
            },
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            spawn(x, y, color, count = 10) {
                for(let i=0; i<count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1.0,
                        color,
                        size: Math.random() * 5 + 2
                    });
                }
            },
            loop() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.life;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    if(p.life <= 0) this.particles.splice(i, 1);
                }
                requestAnimationFrame(() => this.loop());
            }
        };

        /**
         * CORE GAME LOGIC
         */
        const Game = {
            grid: Array.from({length: 8}, () => Array(8).fill(null)),
            score: 0, combo: 0, best: localStorage.getItem('gb_best') || 0,
            hue: 0, activeDrag: null, dock: [null, null, null],

            SHAPES: [
                { s: [[1,1],[1,1]], c: 'c-1' }, { s: [[1,1,1,1]], c: 'c-2' },
                { s: [[1],[1],[1],[1]], c: 'c-2' }, { s: [[1,1,1],[0,1,0]], c: 'c-5' },
                { s: [[1,1,1],[1,0,0]], c: 'c-4' }, { s: [[1,1,1]], c: 'c-3' },
                { s: [[1,1],[0,1],[0,1]], c: 'c-4' }, { s: [[1,1,0],[0,1,1]], c: 'c-2' },
                { s: [[1]], c: 'c-1' }
            ],

            init() {
                FX.init();
                this.createGrid();
                this.refreshDock();
                this.updateUI();
                
                // Shake & Blur handlers
                document.body.addEventListener('pointermove', (e) => {
                    if(!this.activeDrag) return;
                    this.handleDragMove(e);
                });
                document.body.addEventListener('pointerup', (e) => this.handleDragEnd(e));
            },

            createGrid() {
                const gEl = document.getElementById('grid');
                gEl.innerHTML = '';
                for(let r=0; r<8; r++) {
                    for(let c=0; c<8; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.id = `c-${r}-${c}`;
                        gEl.appendChild(cell);
                    }
                }
            },

            refreshDock() {
                this.hue += 45;
                document.documentElement.style.setProperty('--hue', this.hue + 'deg');
                
                const slots = document.querySelectorAll('.dock-slot');
                slots.forEach((slot, i) => {
                    const shapeData = this.SHAPES[Math.floor(Math.random() * this.SHAPES.length)];
                    this.dock[i] = shapeData;
                    slot.innerHTML = '';
                    const el = this.renderShape(shapeData, i);
                    slot.appendChild(el);
                });
                setTimeout(() => this.checkGameOver(), 300);
            },

            renderShape(data, index) {
                const el = document.createElement('div');
                el.className = 'shape';
                el.style.gridTemplateColumns = `repeat(${data.s[0].length}, 1fr)`;
                data.s.forEach(row => row.forEach(val => {
                    const c = document.createElement('div');
                    c.className = val ? `s-cell ${data.c}` : 's-cell';
                    c.style.opacity = val ? '1' : '0';
                    el.appendChild(c);
                }));
                el.addEventListener('pointerdown', (e) => this.handleDragStart(e, data, index, el));
                return el;
            },

            handleDragStart(e, data, index, el) {
                AudioSys.playPick();
                this.activeDrag = { data, index, el, x: e.clientX, y: e.clientY };
                const proxy = document.getElementById('drag-proxy');
                proxy.innerHTML = el.innerHTML;
                proxy.style.display = 'grid';
                proxy.style.gridTemplateColumns = el.style.gridTemplateColumns;
                proxy.style.width = el.offsetWidth + 'px';
                el.style.visibility = 'hidden';
                this.handleDragMove(e);
            },

            handleDragMove(e) {
                const proxy = document.getElementById('drag-proxy');
                proxy.style.left = (e.clientX - proxy.offsetWidth / 2) + 'px';
                proxy.style.top = (e.clientY - proxy.offsetHeight - 80) + 'px';
                
                this.clearGhosts();
                const hover = this.getGridCoord(e);
                if(hover && this.canPlace(this.activeDrag.data.s, hover.r, hover.c)) {
                    this.showGhost(this.activeDrag.data.s, hover.r, hover.c, this.activeDrag.data.c);
                }
            },

            handleDragEnd(e) {
                if(!this.activeDrag) return;
                const proxy = document.getElementById('drag-proxy');
                proxy.style.display = 'none';
                
                const coord = this.getGridCoord(e);
                if(coord && this.canPlace(this.activeDrag.data.s, coord.r, coord.c)) {
                    AudioSys.playSnap();
                    this.placeShape(this.activeDrag.data, coord.r, coord.c);
                    document.querySelector(`.dock-slot[data-id="${this.activeDrag.index}"]`).innerHTML = '';
                    this.dock[this.activeDrag.index] = null;
                    this.processLines();
                    if(this.dock.every(s => s === null)) this.refreshDock();
                } else {
                    this.activeDrag.el.style.visibility = 'visible';
                }
                
                this.clearGhosts();
                this.activeDrag = null;
                this.checkGameOver();
            },

            getGridCoord(e) {
                const el = document.elementFromPoint(e.clientX, e.clientY - 100);
                if(el && el.id.startsWith('c-')) {
                    const parts = el.id.split('-');
                    return { r: parseInt(parts[1]), c: parseInt(parts[2]) };
                }
                return null;
            },

            canPlace(shape, r, c) {
                for(let i=0; i<shape.length; i++) {
                    for(let j=0; j<shape[i].length; j++) {
                        if(shape[i][j]) {
                            const tr = r + i, tc = c + j;
                            if(tr >= 8 || tc >= 8 || this.grid[tr][tc]) return false;
                        }
                    }
                }
                return true;
            },

            placeShape(data, r, c) {
                data.s.forEach((row, i) => row.forEach((val, j) => {
                    if(val) {
                        this.grid[r+i][c+j] = data.c;
                        const cell = document.getElementById(`c-${r+i}-${c+j}`);
                        cell.className = `cell filled ${data.c}`;
                        cell.style.filter = `hue-rotate(${this.hue}deg)`;
                    }
                }));
                this.score += 10;
                this.updateUI();
            },

            processLines() {
                let rC = [], cC = [];
                for(let r=0; r<8; r++) if(this.grid[r].every(v => v)) rC.push(r);
                for(let c=0; c<8; c++) {
                    let full = true;
                    for(let r=0; r<8; r++) if(!this.grid[r][c]) full = false;
                    if(full) cC.push(c);
                }

                if(rC.length || cC.length) {
                    this.combo++;
                    this.score += (rC.length + cC.length) * 100 * this.combo;
                    AudioSys.playBlast(this.combo > 2);
                    AudioSys.playCombo(this.combo);
                    this.shake();
                    if(this.combo > 1) this.showComboMsg();
                    
                    rC.forEach(r => { for(let c=0; c<8; c++) this.clearCell(r, c); });
                    cC.forEach(c => { for(let r=0; r<8; r++) this.clearCell(r, c); });
                } else {
                    this.combo = 0;
                }
                this.updateUI();
            },

            clearCell(r, c) {
                const color = getComputedStyle(document.getElementById(`c-${r}-${c}`)).backgroundColor;
                const rect = document.getElementById(`c-${r}-${c}`).getBoundingClientRect();
                FX.spawn(rect.left + 20, rect.top + 20, color, 15);
                
                this.grid[r][c] = null;
                const cell = document.getElementById(`c-${r}-${c}`);
                cell.style.transform = 'scale(0)';
                setTimeout(() => {
                    cell.className = 'cell';
                    cell.style.transform = '';
                    cell.style.filter = '';
                }, 300);
            },

            shake() {
                document.documentElement.style.setProperty('--shake', '8px');
                document.documentElement.style.setProperty('--blur', '2px');
                setTimeout(() => {
                    document.documentElement.style.setProperty('--shake', '0px');
                    document.documentElement.style.setProperty('--blur', '0px');
                }, 200);
            },

            showComboMsg() {
                const el = document.getElementById('combo-msg');
                el.innerText = `${this.combo}X STREAK!`;
                el.style.display = 'block';
                setTimeout(() => el.style.display = 'none', 1000);
            },

            checkGameOver() {
                let moves = false;
                this.dock.forEach(shape => {
                    if(!shape) return;
                    for(let r=0; r<8; r++) {
                        for(let c=0; c<8; c++) {
                            if(this.canPlace(shape.s, r, c)) moves = true;
                        }
                    }
                });
                if(!moves && this.dock.some(s => s !== null)) {
                    this.endGame();
                }
            },

            endGame() {
                if(this.score > this.best) {
                    this.best = this.score;
                    localStorage.setItem('gb_best', this.best);
                }
                document.getElementById('final-stats').innerText = `SCORE: ${this.score} | BEST: ${this.best}`;
                document.getElementById('game-over').style.display = 'flex';
            },

            reset() {
                this.grid = Array.from({length: 8}, () => Array(8).fill(null));
                this.score = 0; this.combo = 0; this.hue = 0;
                document.getElementById('game-over').style.display = 'none';
                this.init();
            },

            updateUI() {
                document.getElementById('ui-score').innerText = this.score;
                document.getElementById('ui-combo').innerText = `x${this.combo}`;
                document.getElementById('ui-best').innerText = this.best;
            },

            clearGhosts() { document.querySelectorAll('.cell').forEach(c => c.classList.remove('ghost')); },
            showGhost(shape, r, c, cls) {
                shape.forEach((row, i) => row.forEach((v, j) => {
                    if(v) document.getElementById(`c-${r+i}-${c+j}`).classList.add('filled', cls, 'ghost');
                }));
            }
        };

        Game.init();
    </script>
</body>
</html>
